name: Bug report
description: Something on the site, in a lab or in an artifact is wrong.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets, kubeconfigs or private keys.
        For a security issue, use the private advisory link instead of this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home / live demo
        - Artifact explorer
        - Guided lab
        - Quiz
        - 3D atlas
        - Cluster Runner game
        - Cheat sheet
        - Artifact content (YAML, playbook, shell)
        - Container image
        - Documentation
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or file
      description: URL, lab name, question ID or repository path.
      placeholder: https://m0-ar.github.io/DevOpsKodeKloud/lab.html?lab=first-contact
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Type ...
        4. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on Ubuntu 24.04, 1440x900
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no secrets or personal data.
          required: true
